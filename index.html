<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/src/assets/brand/lauklab-logo-256.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      try {
        const appearance = localStorage.getItem('lauklab-theme')
        document.documentElement.dataset.theme = ['light', 'dark'].includes(appearance) ? appearance : 'system'
      } catch { document.documentElement.dataset.theme = 'system' }
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
